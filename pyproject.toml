[project]
name = "klasifipajak"
version = "0.1.0"
description = "Per-transaction tax classification and calculation for Indonesian UMKM and freelancers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["backend/app/engine"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
