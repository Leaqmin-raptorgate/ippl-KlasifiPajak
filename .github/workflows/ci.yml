name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Ruff lint
        run: npm run lint
      - name: Format check (ruff + prettier)
        run: npm run format:check

  test:
    name: pytest (coverage gate)
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: klasifipajak_test
          MYSQL_USER: klasifipajak
          MYSQL_PASSWORD: klasifipajak
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://klasifipajak:klasifipajak@127.0.0.1:3306/klasifipajak_test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_APP_USER: klasifipajak_app
      MYSQL_APP_PASSWORD: klasifipajak_app
      MYSQL_MIGRATE_USER: klasifipajak_migrate
      MYSQL_MIGRATE_PASSWORD: klasifipajak_migrate
      APP_DATABASE_URL: mysql+pymysql://klasifipajak_app:klasifipajak_app@127.0.0.1:3306/klasifipajak
      MIGRATE_DATABASE_URL: mysql+pymysql://klasifipajak_migrate:klasifipajak_migrate@127.0.0.1:3306/klasifipajak_migrate_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Bootstrap app/migrate MySQL users (HB-18 / TC-HARD-23)
        run: |
          python - <<'PY'
          import time
          import pymysql

          for attempt in range(30):
              try:
                  conn = pymysql.connect(
                      host="127.0.0.1",
                      user="root",
                      password="root",
                      autocommit=True,
                  )
                  break
              except pymysql.err.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("MySQL not ready")

          cur = conn.cursor()
          for db in ("klasifipajak", "klasifipajak_migrate_test"):
              cur.execute(
                  f"CREATE DATABASE IF NOT EXISTS {db} "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_bin"
              )
          # Hosts are fixed literals matching docker/mysql-init.sql.
          stmts = [
              "CREATE USER IF NOT EXISTS 'klasifipajak_app'@'%' IDENTIFIED BY 'klasifipajak_app'",
              "CREATE USER IF NOT EXISTS 'klasifipajak_app'@'localhost' IDENTIFIED BY 'klasifipajak_app'",
              "CREATE USER IF NOT EXISTS 'klasifipajak_migrate'@'%' IDENTIFIED BY 'klasifipajak_migrate'",
              "CREATE USER IF NOT EXISTS 'klasifipajak_migrate'@'localhost' IDENTIFIED BY 'klasifipajak_migrate'",
              "ALTER USER 'klasifipajak_app'@'%' IDENTIFIED BY 'klasifipajak_app'",
              "ALTER USER 'klasifipajak_app'@'localhost' IDENTIFIED BY 'klasifipajak_app'",
              "ALTER USER 'klasifipajak_migrate'@'%' IDENTIFIED BY 'klasifipajak_migrate'",
              "ALTER USER 'klasifipajak_migrate'@'localhost' IDENTIFIED BY 'klasifipajak_migrate'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak.* TO 'klasifipajak_app'@'%'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak.* TO 'klasifipajak_app'@'localhost'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_test.* TO 'klasifipajak_app'@'%'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_test.* TO 'klasifipajak_app'@'localhost'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_migrate_test.* TO 'klasifipajak_app'@'%'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_migrate_test.* TO 'klasifipajak_app'@'localhost'",
              "GRANT ALL PRIVILEGES ON klasifipajak.* TO 'klasifipajak_migrate'@'%'",
              "GRANT ALL PRIVILEGES ON klasifipajak.* TO 'klasifipajak_migrate'@'localhost'",
              "GRANT ALL PRIVILEGES ON klasifipajak_test.* TO 'klasifipajak_migrate'@'%'",
              "GRANT ALL PRIVILEGES ON klasifipajak_test.* TO 'klasifipajak_migrate'@'localhost'",
              "GRANT ALL PRIVILEGES ON klasifipajak_migrate_test.* TO 'klasifipajak_migrate'@'%'",
              "GRANT ALL PRIVILEGES ON klasifipajak_migrate_test.* TO 'klasifipajak_migrate'@'localhost'",
              "FLUSH PRIVILEGES",
          ]
          for stmt in stmts:
              cur.execute(stmt)
          conn.close()
          print("app/migrate users ready")
          PY
      - name: Run tests with branch coverage gate (NFR-14)
        run: pytest --cov --cov-fail-under=80 --cov-report=term-missing

  docker:
    name: docker test image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and run tests inside it
        run: docker compose run --rm --build test pytest --cov --cov-fail-under=80 --cov-report=term-missing
