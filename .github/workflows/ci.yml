name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Ruff lint
        run: npm run lint
      - name: Format check (ruff + prettier)
        run: npm run format:check

  test:
    name: pytest (coverage gate)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with branch coverage gate (NFR-14)
        run: pytest --cov --cov-fail-under=80 --cov-report=term-missing

  docker:
    name: docker test image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and run tests inside it
        run: docker compose run --rm --build test pytest --cov --cov-fail-under=80 --cov-report=term-missing
