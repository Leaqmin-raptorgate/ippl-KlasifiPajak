name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Ruff lint
        run: npm run lint
      - name: Format check (ruff + prettier)
        run: npm run format:check

  frontend:
    name: frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # D-11 / M50: vue-tsc runs inside `npm run build` (see frontend/package.json).
      - name: Install and build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

  frontend-unit:
    name: frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend ci
      # Include devDependencies: Vitest/happy-dom vulns live there. Trade-off: a
      # high/critical advisory in a test-only tool fails CI even when production
      # bundles are clean. Prefer that over landing known-critical sandbox RCE pins.
      - name: npm audit (high/critical, incl. dev)
        run: npm --prefix frontend audit --audit-level=high
      - name: Run Vitest
        run: npm --prefix frontend run test:unit

  pip-audit:
    name: pip-audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Pin pip-audit (latest stable) and cvss for CVSS:4.0 vector fallback.
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1 cvss==3.6
      # pip-audit has no native severity filter. Emit JSON, then resolve each
      # vuln id via OSV and fail only on HIGH/CRITICAL (TC-HARD-04 / HB-23).
      # See scripts/ci/fail_on_high_critical.py for the mapping rules.
      - name: Audit requirements (fail on high/critical)
        run: |
          set -euo pipefail
          # pip-audit exits 0 (clean) or 1 (vulns found). Any other rc is a tool failure.
          # Do not swallow with || true — empty/missing JSON would fail-open the gate.
          set +e
          pip-audit -r requirements.txt -f json -o pip-audit.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "FAIL: pip-audit exited with unexpected code $rc"
            exit "$rc"
          fi
          if [ ! -s pip-audit.json ]; then
            echo "FAIL: pip-audit.json missing or empty"
            exit 1
          fi
          python scripts/ci/fail_on_high_critical.py --input pip-audit.json --pip-audit-rc "$rc"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # TC-HARD-05 / HB-24 — block committed secrets. Config: .gitleaks.toml
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${BASE}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep -F " ${ARCHIVE}" checksums.txt | sha256sum -c -
          tar -xz -f "${ARCHIVE}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml

  test:
    name: pytest (coverage gate)
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: klasifipajak_test
          MYSQL_USER: klasifipajak
          MYSQL_PASSWORD: klasifipajak
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://klasifipajak:klasifipajak@127.0.0.1:3306/klasifipajak_test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_APP_USER: klasifipajak_app
      MYSQL_APP_PASSWORD: klasifipajak_app
      MYSQL_MIGRATE_USER: klasifipajak_migrate
      MYSQL_MIGRATE_PASSWORD: klasifipajak_migrate
      APP_DATABASE_URL: mysql+pymysql://klasifipajak_app:klasifipajak_app@127.0.0.1:3306/klasifipajak
      MIGRATE_DATABASE_URL: mysql+pymysql://klasifipajak_migrate:klasifipajak_migrate@127.0.0.1:3306/klasifipajak_migrate_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Bootstrap app/migrate MySQL users (HB-18 / TC-HARD-23)
        run: |
          python - <<'PY'
          import time
          import pymysql

          for attempt in range(30):
              try:
                  conn = pymysql.connect(
                      host="127.0.0.1",
                      user="root",
                      password="root",
                      autocommit=True,
                  )
                  break
              except pymysql.err.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("MySQL not ready")

          cur = conn.cursor()
          for db in ("klasifipajak", "klasifipajak_migrate_test"):
              cur.execute(
                  f"CREATE DATABASE IF NOT EXISTS {db} "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_bin"
              )
          # Hosts are fixed literals matching docker/mysql-init.sql.
          stmts = [
              "CREATE USER IF NOT EXISTS 'klasifipajak_app'@'%' IDENTIFIED BY 'klasifipajak_app'",
              "CREATE USER IF NOT EXISTS 'klasifipajak_app'@'localhost' IDENTIFIED BY 'klasifipajak_app'",
              "CREATE USER IF NOT EXISTS 'klasifipajak_migrate'@'%' IDENTIFIED BY 'klasifipajak_migrate'",
              "CREATE USER IF NOT EXISTS 'klasifipajak_migrate'@'localhost' IDENTIFIED BY 'klasifipajak_migrate'",
              "ALTER USER 'klasifipajak_app'@'%' IDENTIFIED BY 'klasifipajak_app'",
              "ALTER USER 'klasifipajak_app'@'localhost' IDENTIFIED BY 'klasifipajak_app'",
              "ALTER USER 'klasifipajak_migrate'@'%' IDENTIFIED BY 'klasifipajak_migrate'",
              "ALTER USER 'klasifipajak_migrate'@'localhost' IDENTIFIED BY 'klasifipajak_migrate'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak.* TO 'klasifipajak_app'@'%'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak.* TO 'klasifipajak_app'@'localhost'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_test.* TO 'klasifipajak_app'@'%'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_test.* TO 'klasifipajak_app'@'localhost'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_migrate_test.* TO 'klasifipajak_app'@'%'",
              "GRANT SELECT, INSERT, UPDATE, DELETE ON klasifipajak_migrate_test.* TO 'klasifipajak_app'@'localhost'",
              "GRANT ALL PRIVILEGES ON klasifipajak.* TO 'klasifipajak_migrate'@'%'",
              "GRANT ALL PRIVILEGES ON klasifipajak.* TO 'klasifipajak_migrate'@'localhost'",
              "GRANT ALL PRIVILEGES ON klasifipajak_test.* TO 'klasifipajak_migrate'@'%'",
              "GRANT ALL PRIVILEGES ON klasifipajak_test.* TO 'klasifipajak_migrate'@'localhost'",
              "GRANT ALL PRIVILEGES ON klasifipajak_migrate_test.* TO 'klasifipajak_migrate'@'%'",
              "GRANT ALL PRIVILEGES ON klasifipajak_migrate_test.* TO 'klasifipajak_migrate'@'localhost'",
              "FLUSH PRIVILEGES",
          ]
          for stmt in stmts:
              cur.execute(stmt)
          conn.close()
          print("app/migrate users ready")
          PY
      - name: Run tests with branch coverage gate (NFR-14)
        run: pytest --cov --cov-fail-under=80 --cov-report=term-missing

  docker:
    name: docker test image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and run tests inside it
        run: docker compose run --rm --build test pytest --cov --cov-fail-under=80 --cov-report=term-missing
