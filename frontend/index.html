<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101413" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="KlasifiPajak memisahkan omzet usaha dan pekerjaan bebas, lalu menyusun kertas kerja pajak UMKM berdasarkan PP 20/2026."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b6b55'/><text x='16' y='22' font-size='18' font-family='sans-serif' font-weight='600' fill='white' text-anchor='middle'>K</text></svg>"
    />
    <title>KlasifiPajak — Kertas Kerja Pajak UMKM</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kp-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.dataset.theme = t;
          } else {
            document.documentElement.dataset.theme = window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches
              ? "dark"
              : "light";
          }
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
