services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: klasifipajak
      MYSQL_USER: klasifipajak
      MYSQL_PASSWORD: klasifipajak
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  test:
    build: .
    environment:
      APP_ENV: test
      # pytest create_all needs DDL on the test schema (MYSQL_USER grants).
      DATABASE_URL: mysql+pymysql://klasifipajak:klasifipajak@mysql:3306/klasifipajak_test
      JWT_SECRET: test-secret-change-me
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_APP_USER: klasifipajak_app
      MYSQL_APP_PASSWORD: klasifipajak_app
      MYSQL_MIGRATE_USER: klasifipajak_migrate
      MYSQL_MIGRATE_PASSWORD: klasifipajak_migrate
      # Runtime grant probe against app schema; migration wipe uses *_test only.
      APP_DATABASE_URL: mysql+pymysql://klasifipajak_app:klasifipajak_app@mysql:3306/klasifipajak
      MIGRATE_DATABASE_URL: mysql+pymysql://klasifipajak_migrate:klasifipajak_migrate@mysql:3306/klasifipajak_migrate_test
    # Image HEALTHCHECK probes /health; pytest CMD has no listener.
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy

  # One-shot schema apply (HB-18). API depends on this succeeding.
  migrate:
    build: .
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATE_DATABASE_URL: mysql+pymysql://klasifipajak_migrate:klasifipajak_migrate@mysql:3306/klasifipajak
      # Leave APP_ENV unset — init_db must not create_all (B-11).
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  # Development API. Host port 8000 binds to localhost and must never be published.
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      # Runtime least-privilege DML user (HB-18). Schema via migrate service.
      DATABASE_URL: mysql+pymysql://klasifipajak_app:klasifipajak_app@mysql:3306/klasifipajak
      MIGRATE_DATABASE_URL: mysql+pymysql://klasifipajak_migrate:klasifipajak_migrate@mysql:3306/klasifipajak
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - ./backend:/app/backend
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Vite dev server. Host port 5173 binds to localhost.
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  frontend_node_modules:
